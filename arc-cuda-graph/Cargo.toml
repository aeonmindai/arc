[package]
name = "arc-cuda-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPU-autonomous decode: zero CPU overhead via CUDA graph WHILE loops"
license = "Apache-2.0"

[dependencies]
candle-core.workspace = true
mistralrs-quant.workspace = true
mistralrs-paged-attn.workspace = true
half.workspace = true
# Needed by `weights::tensor_device_ptr`: candle stores FP8 tensors as
# `CudaSlice<float8::F8E4M3>`, and `as_cuda_slice::<T>` dispatches on `T`.
float8.workspace = true
tracing.workspace = true

[build-dependencies]
cudaforge = { workspace = true, optional = true }
anyhow.workspace = true
arc-target.workspace = true

[features]
cuda = ["dep:cudaforge", "candle-core/cuda", "mistralrs-paged-attn/cuda", "mistralrs-quant/cuda"]

# Standalone GEMV bench harness — runs kernel variants on real-sized tensors
# without loading the model. Lets us iterate kernel parameters in seconds
# instead of waiting for a Modal redeploy.
[[bin]]
name = "gemv_bench"
path = "src/bin/gemv_bench.rs"
required-features = ["cuda"]
