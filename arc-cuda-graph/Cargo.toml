[package]
name = "arc-cuda-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPU-autonomous decode: zero CPU overhead via CUDA graph WHILE loops"
license = "Apache-2.0"

[dependencies]
candle-core.workspace = true
mistralrs-quant.workspace = true
mistralrs-paged-attn.workspace = true
half.workspace = true
tracing.workspace = true
# So ArcGraph can record its OWN unreachability in the profile tree. A graph
# node reporting 0 ns because it never ran must not read like one that ran
# instantly — `mark_unreachable` is exactly that distinction. No cycle:
# arc-profiler depends only on candle-core/serde/tracing.
arc-profiler = { path = "../arc-profiler" }

[build-dependencies]
cudaforge = { workspace = true, optional = true }
anyhow.workspace = true

[features]
cuda = ["dep:cudaforge", "candle-core/cuda", "mistralrs-paged-attn/cuda", "mistralrs-quant/cuda", "arc-profiler/cuda"]

# Standalone GEMV bench harness — runs kernel variants on real-sized tensors
# without loading the model. Lets us iterate kernel parameters in seconds
# instead of waiting for a Modal redeploy.
[[bin]]
name = "gemv_bench"
path = "src/bin/gemv_bench.rs"
required-features = ["cuda"]
