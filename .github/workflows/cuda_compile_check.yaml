name: CUDA compile check (no GPU)

# WHY THIS EXISTS
# ----------------
# Arc is developed on Apple Silicon (Metal/CPU). The CUDA kernels — QTIP
# (mistralrs-quant/kernels/qtip/*.cu) and the arc-cuda-graph decode/gemv/
# FlashMLASparse kernels — are NEVER compiled by a Mac build. Historically
# the first time nvcc ever saw them was `cargo build --features cuda` on a
# *paid GPU rental* (arc-tools/rental_h100_v4_flash.sh, step 4). An nvcc
# syntax error, an FFI signature drift between ffi.rs and a .cu file, or a
# feature-gated Rust compile error therefore surfaced only after the box was
# already running — which sent work back to the Mac, where the CUDA error
# can't be reproduced.
#
# Compiling CUDA does NOT require a GPU — only the toolkit (nvcc). cudaforge
# reads CUDA_COMPUTE_CAP first (compute_cap.rs detect order: env var ->
# nvidia-smi), so a GPU-less runner cross-compiles the kernels for the
# rental's real arch (sm_80 = A100, sm_90 = H100/Hopper).
#
# Green here => the rental's step-4 build will not fail on an Arc `cuda`-feature
# *compile* error for sm_80/sm_90. (It does NOT compile the `flash-attn` feature
# or link the CLI binaries — that combo is covered by arc-tools/cuda_compile_check.sh
# with FEATURES="cuda flash-attn"; and it does not cover nvcc-version-specific
# differences if the rental box ships a CUDA toolkit other than the 12.4 pinned below.)
#
# SCOPE / HONESTY
# ----------------
# * COMPILATION ONLY. No GPU is present, so no kernel executes. Runtime
#   correctness (the prefix-grouped Viterbi quantize kernel actually running
#   on Hopper, numerical parity, no kernel hang) is validated by the qtip
#   `#[cfg(feature="cuda")]` parity tests, which run on the rental — see
#   arc-tools/rental_h100_v4_flash.sh step 4b and arc-tools/cuda_compile_check.sh.
# * We build the Arc *library* crates with `--features cuda`. Lib builds run
#   nvcc on every Arc .cu file but do NOT perform the final `-lcuda` link
#   (arc-cuda-graph/build.rs links the driver lib, which is absent on a
#   GPU-less runner — only a stub exists). The full binary link with the
#   exact rental feature combo (`cuda flash-attn`) is validated on the build
#   box by arc-tools/cuda_compile_check.sh, where the driver + ample RAM exist.
#
# THE RUST HALF (cuda-typecheck job, added 2026-08-15 — wave31-BG)
# ----------------
# The two nvcc jobs above compile every Arc .cu file, and — because a `cargo
# build --features cuda` of a crate also type-checks that crate's Rust — they
# did cover the `#[cfg(feature = "cuda")]` Rust of three packages
# (mistralrs-quant, arc-cuda-graph, arc-engine + its deps). Two holes remained,
# and both were live:
#   1. The `paths:` filter below did not list `mistralrs-core/**`, so a PR that
#      touched only mistralrs-core did not run this workflow AT ALL. PR #59
#      (XsRollingCache + KvCache::XsRolling, ~1,480 lines through kv_cache,
#      deepseek4 and prefix_cacher) merged to master without a single
#      `--features cuda` build of any kind — `gh pr checks 59` lists no CUDA
#      job. The filter is now keyed on `**/*.rs`: any Rust change anywhere runs
#      the lane, while a docs/wave-log-only PR still skips it.
#   2. Scope was three `--lib` targets. Fourteen workspace crates define a
#      `cuda` feature; those three plus mistralrs-core and mistralrs-paged-attn
#      (pulled in transitively by arc-engine) make five. The remaining NINE —
#      arc-cli, arc-turbo, mistralrs-cli, mistralrs-server-core, mistralrs,
#      mistralrs-pyo3, mistralrs-bench, mistralrs-web-chat, mistralrs-server —
#      had `cuda` enabled by no lane, ever. Two of them own real gated blocks:
#      arc-cli (`run_real_gpu`, the whole `bench::vendor::in_process` module,
#      the real-vendor branch of `bench::run`) and mistralrs-cli
#      (`commands/doctor.rs`); the other seven only forward the feature. Also
#      uncovered: every test target outside mistralrs-quant. The cuda-typecheck
#      job runs `cargo check --workspace --features cuda [--tests]`, which
#      enables `cuda` on every member that has it and covers test targets too.
#
# WHAT THE RUST HALF BUYS — AND WHAT IT DOES NOT
# ----------------
# It buys: compile errors, type errors, borrow errors, FFI signature drift,
# renames, and trait-impl breakage in CUDA-gated Rust — the class that used to
# surface at the start of a *paid* GPU session.
# It does NOT buy runtime correctness. The bug that motivated this lane,
# `as_cuda_slice::<u8>()` on a BF16 buffer (five copies, wave27-AY/AY2),
# compiles perfectly and fails only at runtime on candle's dtype check. No
# amount of type-checking finds it. For that class the answer is the GPU-gated
# regression tests — and actually running them on a GPU.
#
# THE CACHE/ISA TRAP (wave37-BO, fixed 2026-08-16 — read before touching a key)
# ----------------
# A cache keyed WITHOUT an ISA component, combined with `-C target-cpu=native`,
# equals SIGILL on a different runner. Master goes green; the next PR eats it.
#
# That is not hypothetical — it happened one hour after this lane landed. The
# `cargo check (cuda, workspace)` job saved a 4.44 GB `target/` under
# `cuda-check-cc90-<Cargo.lock hash>`. PR #64 restored it onto a runner with a
# different CPU and both `mistralrs-quant` and `mistralrs-paged-attn` died with
# `build-script-build (signal: 4, SIGILL: illegal instruction)`. Zero Rust
# diagnostics; `cargo check` never reached type-checking. Evicting the two
# cache entries by hand took the SAME SHA red -> green with no code change.
#
# Why it is so easy to misread: the failure names crates the PR never touched,
# it looks exactly like a compile error the new gate "caught", and master looks
# healthy because master was the cache MISS that *populated* the poison. The
# first consumer pays, not the producer. It was in fact reported upward as a
# genuine compile error before the logs were read closely.
#
# Two invariants keep it fixed. Break either one and the trap re-arms:
#   1. `RUSTFLAGS` pins a concrete ISA (see the `env:` block below), so nothing
#      in `target/` is built for the builder's specific CPU.
#   2. Every `actions/cache` key AND restore-key that includes `target` carries
#      that ISA as a literal segment, so artifacts can never be restored across
#      an ISA change — and so a bare prefix cannot resurrect an old entry.
# If you would rather not maintain the pin, the other safe answer is to drop
# `target` from the cache `path:` lists entirely and cache only `~/.cargo`,
# which is ISA-independent. Do NOT "fix" this by deleting `target-cpu=native`
# from `.cargo/config.toml` — that flag is a deliberate repo-wide codegen
# choice for an inference engine. The defect was the cache key, not the flag.

on:
  push:
    branches: [master]
    paths:
      # Keyed on "**/*.rs" so a Rust change ANYWHERE runs the lane (build.rs
      # included); a docs/wave-log-only PR still skips it. YAML anchors are not
      # supported by GitHub Actions, hence the duplicated list.
      - "**/*.rs"
      - "**/*.cu"
      - "**/*.cuh"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cuda_compile_check.yaml"
  pull_request:
    # D18 #11: was [master], so stacked PRs never got the nvcc lane — the one
    # lane that catches cuda-gated Rust, which a macOS `cargo check`
    # structurally cannot type-check. Match every base branch.
    branches: ['**']
    paths:
      - "**/*.rs"
      - "**/*.cu"
      - "**/*.cuh"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cuda_compile_check.yaml"
  workflow_dispatch:
    inputs:
      census_only:
        description: >-
          Run ONLY the SASS census job and skip the three heavy build jobs.
          The census is an instrument, not a gate: it needs nvcc but no cargo
          build, so on a saturated runner fleet it makes no sense to queue two
          nvcc lib builds and a workspace type-check behind it just to read an
          instruction table. Default false keeps manual dispatch behaving
          exactly as it did before this input existed.
        type: boolean
        required: false
        default: false

# Widening the trigger to "**/*.rs" makes this workflow run on most PRs, so
# stop paying for superseded runs on the same ref.
# Split for the same reason as `ci.yml` — see the long note there and the PR
# body. `head_ref` keeps each PR in its own group; `github.ref` collapses
# superseded pushes to the same branch instead of leaving one run per commit.
# MANUAL DISPATCHES MUST NOT CANCEL EACH OTHER (measured 2026-08-19).
#
# The group below used to end in `${{ github.head_ref || github.ref }}`, which
# for `workflow_dispatch` resolves to the branch and is therefore IDENTICAL for
# every manual run on that branch. With `cancel-in-progress: true` the second
# dispatch kills the first. That is correct for push/PR -- a newer commit
# supersedes an older one -- but it is wrong for a manual dispatch, where the
# two runs are deliberate and often measure different things.
#
# Not hypothetical: census run 32262762701 was created at 14:13:49Z and run
# 32261447321 (a DIFFERENT commit, queued 13 minutes, carrying results the
# newer run did not yet have) was cancelled at 14:13:51Z. Two seconds apart, no
# other actor involved. The queue slot was simply lost.
#
# `github.run_id` is unique per run, so keying manual dispatches on it makes
# each one its own group. push/pull_request keep the exact group string they
# had, so their superseding behaviour is unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: true

# Bound codegen parallelism so a large CUDA lib build fits a small hosted
# runner (2 vCPU / 7 GB on private repos). A flaky/OOMing gate is worse than
# none.
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RAYON_NUM_THREADS: "2"
  CARGO_INCREMENTAL: "0"
  # ISA PIN — load-bearing. Do not remove without also removing `target` from
  # every `actions/cache` path below. See "THE CACHE/ISA TRAP" at the top.
  #
  # `.cargo/config.toml` sets `[build] rustflags = ["-C","target-cpu=native"]`
  # repo-wide. That is a deliberate choice for real builds and stays. But it
  # also applies to build scripts (verified: a `cargo build -v` with only
  # `[build] rustflags` set emits `-C target-cpu=native` for BOTH
  # `--crate-name build_script_build` and the crate itself), and `native`
  # is the one rustflag value that is *fingerprint-opaque*: Cargo hashes the
  # flag STRING, not the ISA it resolves to. Two runners with different CPUs
  # produce byte-incompatible artifacts under an identical fingerprint, so a
  # restored `target/` is silently mismatched -> SIGILL in build-script-build.
  #
  # Pinning a concrete ISA makes everything in `target/` portable across the
  # hosted fleet and restores the invariant Cargo already relies on (different
  # flags => different fingerprint => rebuild).
  #
  # Why `RUSTFLAGS` and not `CARGO_BUILD_RUSTFLAGS`: rustflags precedence is
  # `RUSTFLAGS` env > `target.<triple>.rustflags` > `build.rustflags`, and only
  # ONE level applies (they do not merge). `CARGO_BUILD_RUSTFLAGS` sits at the
  # `build.rustflags` level, so it would be silently defeated the day anyone
  # adds a `[target.x86_64-unknown-linux-gnu]` section to `.cargo/config.toml`.
  # Verified both ways locally: with a `[target.<triple>]` section present,
  # `CARGO_BUILD_RUSTFLAGS` was ignored and `RUSTFLAGS` won.
  #
  # Why `x86-64-v3` and not plain `x86-64`: v3 (Haswell/Zen1 baseline — AVX,
  # AVX2, BMI1/2, FMA, F16C) is supported by every GitHub-hosted x64 Linux
  # runner, and it keeps `#[cfg(target_feature = "avx")]` ENABLED, so the AVX
  # branch of mistralrs-quant/src/f8q8/mod.rs stays compiled. Plain `x86-64`
  # exposes only sse/sse2 and would silently drop that path from the gate.
  RUSTFLAGS: "-C target-cpu=x86-64-v3"

jobs:
  cuda-compile:
    name: nvcc compile (sm_${{ matrix.compute_cap }})
    runs-on: ubuntu-latest
    # Skipped when a manual dispatch asks for the census alone (see the
    # `census_only` input at the top). `github.event.inputs` is null on
    # push/pull_request, so this reduces to `true` there.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.census_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        # 80 = A100, 90 = H100/Hopper (the V4 Flash rental target).
        compute_cap: ["80", "90"]
    env:
      CUDA_COMPUTE_CAP: ${{ matrix.compute_cap }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # The CUDA toolkit (~7 GB installed) + the cuda target dir need
          # headroom; reclaim ~20 GB from preinstalled toolchains we don't use.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install CUDA toolkit (no driver, no GPU)
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.4.1"
          # 'local' + --toolkit is the canonical GPU-less CI install: the full
          # toolkit (nvcc, cudart, curand, cublas, driver *stub*) minus the GPU
          # driver and samples.
          method: "local"
          linux-local-args: '["--toolkit"]'

      - name: CUDA + link-path setup
        run: |
          echo "CUDA_COMPUTE_CAP=$CUDA_COMPUTE_CAP"
          which nvcc
          nvcc --version
          # Defensive: put the driver stub on the linker path so any
          # transitive `-lcuda` resolves even though no GPU/driver is present.
          CUDA_ROOT="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          echo "LIBRARY_PATH=${CUDA_ROOT}/lib64/stubs:${CUDA_ROOT}/lib64:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${CUDA_ROOT}/lib64/stubs:${CUDA_ROOT}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # The `-X64-isa-x86-64-v3-` segment records the ISA the cached
          # artifacts were compiled for (see the RUSTFLAGS note at the top of
          # this file). It is not decoration: it is what makes the cache safe
          # to restore onto a different runner, and changing the ISA pin above
          # MUST change this token too. The restore-key prefix carries it as
          # well — a bare `cuda-cc90-` prefix would happily match (and restore)
          # the pre-fix, `target-cpu=native` entries this change orphans.
          key: cuda-cc${{ matrix.compute_cap }}-${{ runner.arch }}-isa-x86-64-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cuda-cc${{ matrix.compute_cap }}-${{ runner.arch }}-isa-x86-64-v3-

      # ---- The gate. Each `cargo build` here runs nvcc on the Arc .cu files
      #      for the matrix arch. These are LIBRARY builds (no final -lcuda
      #      link), so they are GPU-less-safe. A failure is a failure the
      #      rental would have hit on step 4.

      # `--lib` keeps these pure rlib builds: build.rs still runs nvcc on every
      # Arc .cu file, but no binary is produced, so there is no final `-lcuda`
      # link (arc-cuda-graph ships a `gemv_bench` bin gated on `cuda` that would
      # otherwise link the driver lib, absent on a GPU-less runner).
      - name: Compile QTIP CUDA kernels (mistralrs-quant)
        run: cargo build -p mistralrs-quant --lib --features cuda

      - name: Compile arc-cuda-graph CUDA kernels
        run: cargo build -p arc-cuda-graph --lib --features cuda

      - name: Compile arc-engine cuda (transitively quant + cuda-graph + core + paged-attn)
        run: cargo build -p arc-engine --lib --features cuda

      - name: Compile-check CUDA-gated tests (no run — no GPU)
        run: |
          # `--no-run` compiles the #[cfg(feature="cuda")] qtip parity tests
          # (cuda_quantize_matches_cpu_dequantize_cos_sim, cuda_fused_gemv_*,
          # qtip_gather_forward_cuda_matches_cpu, ...) so FFI/signature drift
          # in test code is caught too. They EXECUTE only on a real GPU
          # (rental step 4b).
          cargo test --no-run -p mistralrs-quant --features cuda

  # ---------------------------------------------------------------------------
  # The Rust half: type-check every `#[cfg(feature = "cuda")]` block in the
  # WORKSPACE, not just the three packages the nvcc jobs build. See the "THE
  # RUST HALF" note at the top of this file for the two holes this closes.
  #
  # `cargo check` still runs every build.rs, so nvcc compiles the .cu files here
  # too — that work is unavoidable, not duplicated for its own sake. One compute
  # cap is enough: no Arc Rust is `cfg`-gated on the arch, only the .cu files
  # are, and sm_80/sm_90 are covered above. `check` never links, so the absent
  # driver (`-lcuda`) is a non-issue.
  # ---------------------------------------------------------------------------
  cuda-typecheck:
    name: cargo check (cuda, workspace)
    runs-on: ubuntu-latest
    # Skipped when a manual dispatch asks for the census alone (see the
    # `census_only` input at the top). `github.event.inputs` is null on
    # push/pull_request, so this reduces to `true` there.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.census_only != 'true'
    env:
      # H100/Hopper — the V4 Flash rental target.
      CUDA_COMPUTE_CAP: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install CUDA toolkit (no driver, no GPU)
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.4.1"
          method: "local"
          linux-local-args: '["--toolkit"]'

      - name: CUDA + link-path setup
        run: |
          echo "CUDA_COMPUTE_CAP=$CUDA_COMPUTE_CAP"
          which nvcc
          nvcc --version
          CUDA_ROOT="${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          echo "LIBRARY_PATH=${CUDA_ROOT}/lib64/stubs:${CUDA_ROOT}/lib64:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${CUDA_ROOT}/lib64/stubs:${CUDA_ROOT}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # See the identical note on the nvcc job's cache above. This is the
          # key that actually bit: `cuda-check-cc90-<lockhash>` with a bare
          # `cuda-check-cc90-` restore prefix. PR #64 restored a 4.44 GB entry
          # saved by a different-CPU runner and died with
          # `build-script-build (signal: 4, SIGILL: illegal instruction)` in
          # mistralrs-quant AND mistralrs-paged-attn — a crate its diff never
          # touched — before `cargo check` type-checked a single line.
          key: cuda-check-cc90-${{ runner.arch }}-isa-x86-64-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cuda-check-cc90-${{ runner.arch }}-isa-x86-64-v3-

      # `--workspace --features cuda` turns the `cuda` feature on for every
      # workspace member that defines one (14 of them today), so the FFI shims,
      # pointer helpers, graph-capture code, sampler bindings and cache variants
      # are all compiled — including in the crates the nvcc jobs never touch.
      - name: Type-check CUDA-gated Rust (workspace)
        run: cargo check --workspace --features cuda

      # Extends the same check to test targets. Several CUDA-gated tests are
      # written on a Mac and never compiled anywhere until a GPU is rented
      # (radix_topk_rows_f32_accepts_f32_scores,
      # tensor_ptr_accepts_every_decode_buffer_dtype, the fused-vs-fallback
      # parity tests, the XsRolling equivalence test). `check --tests` does no
      # codegen, so it is a fraction of the cost of `cargo test --no-run`.
      # These still only EXECUTE on a real GPU.
      - name: Type-check CUDA-gated tests (no codegen, no run)
        run: cargo check --workspace --features cuda --tests

  # ---------------------------------------------------------------------------
  # SASS CENSUS (manual dispatch only)
  #
  # Converts the QTIP trellis geometry ladder from estimates into measurements.
  # `nvcc -cubin` performs DEVICE-ONLY codegen: no host compile, no link, no
  # driver, no GPU -- exactly the same reason the two jobs above work on a
  # GPU-less runner. cuobjdump then disassembles the cubin to SASS and the
  # script counts instructions per kernel.
  #
  # Why this must be measured and not reasoned about: hand-counting from C++
  # undercounts SASS by ~2.05x on this kernel family (a census subagent made
  # that error and had its answer retracted). The static-SASS instrument itself
  # is validated in-tree -- 35.06 static vs 35.52 ncu on the GEMV (1.3%), and
  # instruction count tracking measured time ~1:1 on the grouped GEMM
  # (qtip_grouped_gemm.cu:125-133).
  #
  # `if:` keeps this off every PR. It is an instrument, not a gate -- it has no
  # pass/fail, it prints a table. Run it with:
  #     gh workflow run cuda_compile_check.yaml --ref <branch>
  # ---------------------------------------------------------------------------
  sass-census:
    name: QTIP geometry SASS census (no GPU)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA toolkit (no driver, no GPU)
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.4.1"
          method: "local"
          linux-local-args: '["--toolkit"]'

      - name: Toolchain provenance
        run: |
          which nvcc cuobjdump
          nvcc --version
          cuobjdump --version

      # sm_90 is the H100/H200 target the in-tree anchors were produced on.
      # sm_80 is compiled too so the geometry conclusions can be checked for
      # arch-sensitivity (LDS width and PRMT availability differ in cost).
      - name: SASS census (sm_90)
        run: python3 arc-tools/sass_census/run_census.py --arch sm_90 | tee census_sm90.txt

      - name: SASS census (sm_80)
        run: python3 arc-tools/sass_census/run_census.py --arch sm_80 | tee census_sm80.txt

      - name: Upload census
        uses: actions/upload-artifact@v4
        with:
          name: qtip-sass-census
          path: census_sm*.txt
