on: 
  schedule:
      - cron: '0 0 * * 1'
  push:
    branches: 
      - master
  pull_request:
    # D18 #11: this was `- master`, so a PR whose BASE was another PR's branch
    # (a stack) matched nothing here and ran zero lanes. The only workflow
    # without a branch filter is analysis.yaml (`pull_request_target`), so such
    # a PR showed exactly one check — `comment` — and read as green while
    # nothing had been compiled, tested, linted or nvcc'd. Six PRs sat in that
    # state. Match every base branch; stacked PRs are normal here.
    branches:
      - '**'
  workflow_dispatch:

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check

  check-metal:
    name: Check (metal)
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --features metal

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: actions-rs/cargo@v1
        env:
          TESTS_HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          command: test
          args: -p mistralrs-core -p mistralrs-quant -p mistralrs-vision

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      # Arc is a fork of EricLBuehler/mistral.rs. Formatting is checked only on
      # Arc-authored crates so the fork stops inheriting upstream rustfmt drift
      # (mass-reformatting the ~90 upstream mistralrs-* files would create a
      # large merge-conflict surface on every upstream sync). See
      # arc-tools/CI_HYGIENE.md.
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: -p arc-bench -p arc-engine -p arc-cuda-graph -p arc-cli -p arc-profiler -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      # Scoped to Arc-authored crates with `--no-deps` so the fork is not gated
      # on upstream mistralrs-* lint debt (e.g. ~140 `type_complexity` and
      # pedantic-cast findings across the upstream model files, latent until
      # now). `--no-deps` lints only the listed packages, not their workspace
      # dependencies. Arc code inside mistralrs-core (dsv4/turboquant) is kept
      # clean directly. See arc-tools/CI_HYGIENE.md.
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --no-deps -p arc-bench -p arc-engine -p arc-cuda-graph -p arc-cli -p arc-profiler -p mistralrs-quant --tests --examples -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --workspace

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Typos check with custom config file
        uses: crate-ci/typos@master
        with:
          config: .typos.toml

  msrv:
    name: MSRV Check (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.90.0
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace

  # D18 #11 GUARD — the job that makes "green" mean something.
  #
  # Fixing the `pull_request` branch filter above stops THIS instance, but the
  # class of defect is "the real lanes did not run and their absence read as a
  # pass". A branch filter is only one way to reach that state; a skipped job,
  # a renamed job, a matrix that expands to nothing, or a `paths:` filter that
  # excludes everything all reproduce it exactly.
  #
  # So: this job depends on every substantive lane, runs even when they fail or
  # are skipped (`if: always()`), and fails unless each one actually SUCCEEDED.
  # `skipped` and `cancelled` are failures here — that is the entire point.
  # It also asserts the lane COUNT, so silently deleting a lane trips it rather
  # than quietly shrinking what green covers.
  #
  # Make THIS the required status check in branch protection. It is the only
  # job whose non-success is unambiguous, and unlike the individual lanes it
  # cannot pass by not existing.
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    if: always()
    needs:
      - check
      - check-metal
      - test
      - fmt
      - clippy
      - docs
      - typos
      - msrv
    steps:
      - name: Assert every lane ran and succeeded
        env:
          # Passed via env, not interpolated into the script, so a lane result
          # can never be shell-injected.
          LANE_RESULTS: ${{ join(needs.*.result, ' ') }}
          EXPECTED_LANES: '8'
        run: |
          set -euo pipefail
          echo "lane results: ${LANE_RESULTS}"
          n=0
          for r in ${LANE_RESULTS}; do
            n=$((n + 1))
            if [ "${r}" != "success" ]; then
              echo "::error::A CI lane reported '${r}'. Refusing to report green."
              exit 1
            fi
          done
          if [ "${n}" -ne "${EXPECTED_LANES}" ]; then
            echo "::error::Expected ${EXPECTED_LANES} lanes, saw ${n}. The job set drifted — update ci-complete's needs list deliberately, do not let green shrink silently."
            exit 1
          fi
          echo "All ${n} lanes succeeded."

  # run `mlc` (`cargo install mlc`)
  # markdown-link-check:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: gaurav-nelson/github-action-markdown-link-check@v1
