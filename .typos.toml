[files]
extend-exclude = [
    ".git/",
    "calibration_data/",
    "examples/server/phi3_duckduckgo_mistral.rs.ipynb",
    "mistralrs-web-chat/static/",
    "mistralrs-cli/static/",
    "CLAUDE.md",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    "cudaDevAttrMaxSharedMemoryPerBlockOptin",
    '"tese"',
    "setp\\.ne\\.b32",
    # metal_kernels
    "out uneeded values",
    "copy_gg_dynamic_nd1",
    "copy_gg_dynamic_nd2",
    "copy_gg_dynamic_nd3",
    "copy_g_nd1",
    "copy_g_nd2",
    "copy_g_nd3",
    "copy_gg_nd1",
    "copy_gg_nd2",
    "copy_gg_nd3",
    "elem_to_loc_2_nd",
    "elem_to_loc_3_nd",
    "thr_reduce",
    "(?i)thw",
    "iy",
    "mxfp4_get_max_smem_optin",
    "alog",
    "ba",
]

[default.extend-words]
"layrnorm" = "layrnorm"
"wht" = "wht"
"WHT" = "WHT"
# Arc domain terms, algorithm/library names, and numerical-code variable names
# flagged as typos but intentional. Allow-listed (not renamed) to avoid
# semantic breakage in hot numerical paths and to keep model/research naming.
#   nd/clen/tpos  : loop/accumulator + sequence-length variables (Rust + CUDA)
#   suh/svh       : EXL3 trellis tensor names
#   ue            : UE8M0 FP8 scale format (DeepSeek V4)
#   ba            : MoBA (Mixture of Block Attention)
#   fied          : "ReLU-fied" weights
#   mis           : "mis-route"
#   maddness/hass : Maddness, HASS (algorithm names)
#   ist           : IST-DASLab (research org)
#   ratatui       : the Ratatui TUI crate
#   writeable     : valid alternate spelling used in kernel comments
#   optin         : "opt-in" without the hyphen — CUDA's
#                   cudaDevAttrMaxSharedMemoryPerBlockOptin, and filenames /
#                   branches that cannot carry a hyphen there
"nd" = "nd"
"clen" = "clen"
"tpos" = "tpos"
"suh" = "suh"
"svh" = "svh"
"fied" = "fied"
"mis" = "mis"
"writeable" = "writeable"
"maddness" = "maddness"
"hass" = "hass"
"ist" = "ist"
"ue" = "ue"
"ba" = "ba"
"ratatui" = "ratatui"
# candle's (and numpy's) `Tensor::arange`. Already exempt as a bare Rust
# identifier below, but it also appears as a *word inside* longer identifiers
# — e.g. test names describing the arange expression they replaced — and
# extend-identifiers only matches whole identifiers.
"arange" = "arange"
"optin" = "optin"

[type.md.extend-identifiers]
"arange" = "arange"

[type.rust.extend-identifiers]
"arange" = "arange"
"arange_step" = "arange_step"
"cna" = "cna"
"from_mmaped_safetensors" = "from_mmaped_safetensors"
"MmapedSafetensors" = "MmapedSafetensors"
"nin_shortcut" = "nin_shortcut"
"EmbedNd" = "EmbedNd"
"gather_nd" = "gather_nd"
"i_thw" = "i_thw"
"cached_img_thw" = "cached_img_thw"
"cached_vid_thw" = "cached_vid_thw"
"video_grid_thw" = "video_grid_thw"
"image_grid_thw" = "image_grid_thw"
"grid_thw" = "grid_thw"
"vision_grid_thw" = "vision_grid_thw"
"video_grid_thw_accum" = "video_grid_thw_accum"
"image_grid_thw_accum" = "image_grid_thw_accum"
"image_thw" = "image_thw"
"video_thw" = "video_thw"
"depthwise_seperable_out_channel" = "depthwise_seperable_out_channel"
