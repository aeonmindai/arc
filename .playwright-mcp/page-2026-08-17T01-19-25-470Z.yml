      - generic [ref=e124]:
        - generic [ref=e125]: The one asymmetry to keep in your head
        - text: Prefill is compute-bound. Decode is memory-bound. They need opposite fixes, and mixing them up has cost this project real money. Prefill already scales — server-instrumented prefill rises 171.6 → 314.7 tok/s from B=1 to B=256
        - code [ref=e126]: "[measured]"
        - text: . Decode rises further and from much lower, and every hard problem below is a decode problem. Batching is the one lever that turns decode's memory-bound shape into prefill's compute-bound shape — which is why aggregate throughput and per-user throughput pull in opposite directions, and why you must always say which one you mean.
