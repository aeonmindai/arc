        - generic [ref=f8e123]: The one asymmetry to keep in your head
        - text: Prefill is compute-bound. Decode is memory-bound. They need opposite fixes, and mixing them up has cost this project real money. Prefill already scales — server-instrumented prefill rises 4.8× from B=1 to B=64
        - code [ref=f8e124]: "[measured]"
        - text: . Decode does not, and every hard problem below is a decode problem. Batching is the one lever that turns decode's memory-bound shape into prefill's compute-bound shape — which is why aggregate throughput and per-user throughput pull in opposite directions, and why you must always say which one you mean.
